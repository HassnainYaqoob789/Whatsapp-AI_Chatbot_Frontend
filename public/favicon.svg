<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="naraFavGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
  </defs>

  <!-- iOS-style Rounded Squircle Background -->
  <rect width="100" height="100" rx="26" fill="url(#naraFavGrad)" />

  <!-- Top Antenna -->
  <circle cx="50" cy="18" r="5.5" fill="#FFFFFF" />
  <rect x="47.5" y="22" width="5" height="8" rx="2.5" fill="#FFFFFF" />

  <!-- Main Speech Bubble Body with Tail -->
  <path 
    d="M 33 29 
       H 67 
       C 79 29 88 38 88 50 
       V 58 
       C 88 70 79 79 67 79 
       H 38 
       L 22 91 
       L 24 79 
       C 17 78 12 73 12 65 
       V 50 
       C 12 38 21 29 33 29 Z" 
    fill="#FFFFFF" 
  />

  <!-- Inner Robot Visor -->
  <rect 
    x="25" 
    y="43" 
    width="50" 
    height="24" 
    rx="12" 
    fill="#1E1B4B" 
  />

  {/* Glowing Eyes */}
  <circle cx="39" cy="55" r="5.5" fill="url(#eyeGrad)" />
  <circle cx="41" cy="53" r="1.8" fill="#FFFFFF" />

  <circle cx="61" cy="55" r="5.5" fill="url(#eyeGrad)" />
  <circle cx="63" cy="53" r="1.8" fill="#FFFFFF" />

  {/* Smile Indicator */}
  <rect x="46" y="61" width="8" height="2" rx="1" fill="#818CF8" />
</svg>